<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Count</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1f2430; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --add:#16a34a; --remove:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:32px 16px 64px;}
  header h1{font-size:24px;margin:0 0 4px;}
  header p{margin:0 0 20px;color:var(--muted);font-size:14px;}
  .total{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .total b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .item-name{font-weight:600;font-size:15px;}
  .count{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;
         min-width:72px;text-align:right;transition:color .3s ease;}
  .count.bump{animation:bump .3s ease;}
  @keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
  .count.up{color:var(--add)} .count.down{color:var(--remove)}
  .controls{display:flex;gap:8px;flex-wrap:wrap;}
  .controls input{width:88px;padding:8px 10px;font-size:15px;font:inherit;
        border:1px solid var(--line);border-radius:8px;text-align:center;
        font-variant-numeric:tabular-nums;}
  .controls input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .controls input.shake{animation:shake .3s ease;border-color:var(--remove);}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;
         padding:8px 12px;font-size:14px;font-weight:600;transition:background .15s ease;}
  button:active{transform:translateY(1px);}
  .btn-add{background:#ecfdf5;color:#166534;border-color:#dcfce7;}
  .btn-add:hover{background:#dcfce7;}
  .btn-remove{background:#fef2f2;color:#991b1b;border-color:#fee2e2;}
  .btn-remove:hover{background:#fee2e2;}
  .finish{display:block;width:100%;margin-top:24px;padding:14px;font-size:16px;
          background:#111827;color:#fff;border-radius:12px;}
  .finish:hover{background:#1f2937;}
  .final{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:20px;box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .final h2{margin:0 0 12px;font-size:18px;}
  .final ul{list-style:none;margin:0 0 16px;padding:0;}
  .final li{display:flex;justify-content:space-between;padding:10px 0;
            border-bottom:1px solid var(--line);font-size:15px;}
  .final li:last-child{border-bottom:none;}
  .final li span:last-child{font-weight:700;font-variant-numeric:tabular-nums;}
  .copy-btn{width:100%;padding:11px;font-size:15px;background:#eef2ff;color:#3730a3;border-color:#e0e7ff;}
  .copy-btn.copied{background:#ecfdf5;color:#166534;border-color:#dcfce7;}
  .back{display:block;margin:14px auto 0;background:none;border:none;color:var(--muted);
        font-size:13px;font-weight:500;text-decoration:underline;}
  .hidden{display:none;}
  input[type=number]::-webkit-inner-spin-button, 
  input[type=number]::-webkit-outer-spin-button { 
  -webkit-appearance: none; 
  margin: 0; 
}
input[type=number] {
  -moz-appearance: textfield;
}
  /* Search Bar */
  .search-bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:4px 0 16px;margin-bottom:4px;}
  .search-input-wrap{position:relative;display:flex;align-items:center;}
  .search-bar input{width:100%;padding:10px 90px 10px 14px;font-size:15px;font:inherit;
        border:1px solid var(--line);border-radius:10px;background:var(--card);
        box-shadow:0 1px 2px rgba(16,24,40,.04);}
  .search-bar input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
  .search-count{position:absolute;right:72px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;}
  .search-next-btn{position:absolute;right:4px;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;}
  .search-next-btn.hidden, .search-count.hidden{display:none;}
  .item.highlight{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.2);transition:box-shadow .3s ease, border-color .3s ease;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Inventory Count</h1>
    <p>Type a number, then pick an action: <b>+ Add</b> and <b>&minus; Remove</b> adjust by that number.</p>
  </header>

  <div id="editor">
  <div class="search-bar">
    <div class="search-input-wrap">
      <input type="search" id="searchInput" placeholder="🔍 Jump to item..." aria-label="Jump to item">
      <span id="searchCount" class="search-count hidden">0/0</span>
      <button type="button" id="nextMatchBtn" class="search-next-btn hidden" aria-label="Next match">Next &darr;</button>
    </div>
  </div>
  <div class="total"><b id="total"></b></div>
    <!-- item rows are injected here, above the finish button -->
    <button class="finish" id="finishBtn">Finish Counting</button>
  </div>

  <div id="final" class="hidden">
    <div class="final">
      <h2>Final Counts</h2>
      <ul id="finalList"></ul>
      <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>
	  <button class="copy-btn" id="resetBtn" style="margin-top: 10px; background: #fef2f2; color: #991b1b; border-color: #fee2e2;">Start New Count</button>
      <button class="back" id="backBtn">&larr; Back to editing</button>
    </div>
  </div>
</div>

      { name: "Sourdough", category: "Bread", type: "unit" }
  ];

  const CONTAINERS = [
  { name: "None / No Container", tare: 0 },
  { name: "Tall Green Cambro", tare: 0.95 },
  { name: "Short Green Cambro", tare: 0.65 },
  { name: "Red Cambro", tare: 1.50 },
  { name: "6 Pan", tare: 0.80 }
];

  // Load state from localStorage if it exists
  const savedData = localStorage.getItem(STORAGE_KEY);
  let initialCounts = null;
  try {
    initialCounts = savedData ? JSON.parse(savedData) : null;
  } catch (e) {
    console.error('Failed to parse saved inventory state', e);
  }

  const state = ITEMS.map(item => {
    const found = initialCounts?.find(saved => saved.name === item.name);
    return { 
      name: item.name, 
      type: item.type,
      unit: item.unit || 'units',
	  category: item.category,
      count: found && typeof found.count === 'number' ? found.count : 0 
    };
  });

  const rows  = [];

  const editor    = document.getElementById('editor');
  const finishBtn = document.getElementById('finishBtn');
  const finalView = document.getElementById('final');
  const finalList = document.getElementById('finalList');
  const copyBtn   = document.getElementById('copyBtn');
  const resetBtn  = document.getElementById('resetBtn');
  const backBtn   = document.getElementById('backBtn');
  const totalEl   = document.getElementById('total');

  // Build one row per item with category section headers
  let lastCategory = '';
  state.forEach((item, i) => {
    if (item.category !== lastCategory) {
      lastCategory = item.category;
      const header = document.createElement('div');
      header.style.cssText = 'font-weight:700; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin:24px 0 8px 4px;';
      header.textContent = lastCategory;
      editor.insertBefore(header, finishBtn);
    }

    const row = document.createElement('div');
    row.className = 'item';
    
    let extraHtml = '';
    if (item.type === 'weight') {
      const optionsHtml = CONTAINERS.map(c => 
        `<option value="${c.tare}">${c.name} (${c.tare} lbs)</option>`
      ).join('');
      
      extraHtml = `<div style="margin-top: 8px; font-size: 13px; color: var(--muted);">Container: <select class="container-select" style="padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); font: inherit; font-size: 13px;">${optionsHtml}</select></div>`;
    }
  
    row.innerHTML = `
      <div class="item-top">
        <span class="item-name"></span>
        <span class="count">${item.count.toLocaleString()}</span>
      </div>
      <div class="controls">
        <input type="number" min="0" step="${item.type === 'weight' ? '0.1' : '1'}" inputmode="decimal"
                placeholder="${item.type === 'weight' ? 'Weight' : 'Amount'}" aria-label="Amount for ${item.name}">
        <button class="btn-add">+ Add</button>
        <button class="btn-remove">&minus; Remove</button>
      </div>
      ${extraHtml}`;
      
    row.querySelector('.item-name').textContent = item.name;
    const input  = row.querySelector('input');
    const countEl = row.querySelector('.count');
    const containerSelect = row.querySelector('.container-select');
    rows.push({input, countEl, containerSelect, row});
  
    const adjust = dir => {
      const raw = input.value.trim();
      const num = raw === '' ? 0 : Number(raw);
      
      if (!Number.isFinite(num) || num <= 0) return nudge(input);
  
      let amountToAddOrRemove = num;
  
      if (item.type === 'weight' && containerSelect) {
        const tareWeight = Number(containerSelect.value) || 0;
        amountToAddOrRemove = Math.max(0, num - tareWeight);
      } else {
        amountToAddOrRemove = Math.round(num);
      }
  
      setCount(i, Math.max(0, state[i].count + dir * amountToAddOrRemove), dir > 0 ? 'up' : 'down');
      input.value = '';
    };

    row.querySelector('.btn-add').addEventListener('click', () => adjust(1));
    row.querySelector('.btn-remove').addEventListener('click', () => adjust(-1));

    editor.insertBefore(row, finishBtn);
  });
  function nudge(input){
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    input.focus();
  }

  function setCount(i, value, flash){
    state[i].count = value;
    const {countEl} = rows[i];
    countEl.textContent = value.toLocaleString();
    countEl.classList.remove('bump','up','down');
    void countEl.offsetWidth;
    countEl.classList.add('bump');
    if (flash) {
      countEl.classList.add(flash);
      clearTimeout(countEl._t);
      countEl._t = setTimeout(() => countEl.classList.remove('up','down'), 900);
    }

    // Save changes immediately to localStorage
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Failed to save inventory state', e);
    }
  }

  // Finish: swap to a read-only list
  finishBtn.addEventListener('click', () => {
    finalList.innerHTML = '';
    state.forEach(item => {
      const li = document.createElement('li');
      const n  = document.createElement('span'); n.textContent = item.name;
      const v  = document.createElement('span'); v.textContent = item.count.toLocaleString();
      li.append(n, v);
      finalList.appendChild(li);
    });
    editor.classList.add('hidden');
    finalView.classList.remove('hidden');
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // Copy to clipboard (with fallback for older browsers)
  copyBtn.addEventListener('click', async () => {
    const text = state.map(i => `${i.name}: ${i.count}`).join('\n');
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    copyBtn.textContent = '\u2713 Copied to Clipboard';
    copyBtn.classList.add('copied');
    setTimeout(() => { copyBtn.textContent = 'Copy to Clipboard'; copyBtn.classList.remove('copied'); }, 1600);
  });

  // Reset functionality with confirmation prompt
  resetBtn.addEventListener('click', () => {
    if (confirm('Are you sure you want to clear all counts and start a new inventory?')) {
      // Clear localStorage
      localStorage.removeItem(STORAGE_KEY);

      // Reset state array
      state.forEach((item, i) => {
        state[i].count = 0;
        rows[i].countEl.textContent = '0';
        rows[i].input.value = '';
      });

      // Switch back to the editor view
      finalView.classList.add('hidden');
      editor.classList.remove('hidden');
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
  });

  // Back to editing keeps all current counts
  backBtn.addEventListener('click', () => {
    finalView.classList.add('hidden');
    editor.classList.remove('hidden');
  });

 // Search / Cycle Match functionality
 const searchInput = document.getElementById('searchInput');
 const nextMatchBtn = document.getElementById('nextMatchBtn');
 const searchCount = document.getElementById('searchCount');
 
 let matchingIndices = [];
 let currentMatchPointer = 0;
 
 function jumpToMatch(index) {
   if (matchingIndices.length === 0) return;
   
   // Remove highlight from all rows first
   rows.forEach(r => r.row.classList.remove('highlight'));
   
   const targetDataIndex = matchingIndices[index];
   const targetRow = rows[targetDataIndex];
   
   targetRow.row.scrollIntoView({ behavior: 'smooth', block: 'center' });
   targetRow.row.classList.add('highlight');
   
   // Update badge text
   searchCount.textContent = `${index + 1}/${matchingIndices.length}`;
 }
 
 function performSearch() {
   const query = searchInput.value.toLowerCase().trim();
   if (!query) {
     matchingIndices = [];
     searchCount.classList.add('hidden');
     nextMatchBtn.classList.add('hidden');
     rows.forEach(r => r.row.classList.remove('highlight'));
     return;
   }
   
   matchingIndices = [];
   state.forEach((item, idx) => {
     if (item.name.toLowerCase().includes(query)) {
       matchingIndices.push(idx);
     }
   });
   
   if (matchingIndices.length > 0) {
     currentMatchPointer = 0;
     searchCount.classList.remove('hidden');
     nextMatchBtn.classList.remove('hidden');
     jumpToMatch(currentMatchPointer);
   } else {
     searchCount.classList.add('hidden');
     nextMatchBtn.classList.add('hidden');
     rows.forEach(r => r.row.classList.remove('highlight'));
   }
 }
 
 searchInput.addEventListener('input', performSearch);
 
 nextMatchBtn.addEventListener('click', (e) => {
   e.preventDefault();
   if (matchingIndices.length === 0) return;
   currentMatchPointer = (currentMatchPointer + 1) % matchingIndices.length;
   jumpToMatch(currentMatchPointer); 
 });
 
 searchInput.addEventListener('keydown', (e) => {
   if (e.key === 'Enter') {
     e.preventDefault();
     if (matchingIndices.length === 0) return;
     currentMatchPointer = (currentMatchPointer + 1) % matchingIndices.length;
     jumpToMatch(currentMatchPointer);
   }
 });
</script>
</body>
</html>
